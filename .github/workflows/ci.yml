name: CI

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, and browser
    runs-on:
      group: public-builds
      labels: [self-hosted, Linux, X64, docker, homelab, public-builds]
    # Browser libraries are preinstalled; each job has its own network/port 7321.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Browser project workflow
        env:
          TODOLIZT_TEST_ORIGIN: http://127.0.0.1:7321
          TODOLIZT_TEST_ARTIFACTS: ${{ runner.temp }}/todolizt-projects-browser
        run: |
          node node_modules/next/dist/bin/next start -H 127.0.0.1 -p 7321 > "$RUNNER_TEMP/next.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$TODOLIZT_TEST_ORIGIN/"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/next.log"
            exit 1
          fi
          npm run test:browser

      - name: Restore workspace ownership for the shared runner
        if: always()
        run: chown -R "$(stat -c '%u:%g' "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE"
