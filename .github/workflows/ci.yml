name: CI

on:
  workflow_call:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, and browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser project workflow
        env:
          TODOLIZT_TEST_ORIGIN: http://127.0.0.1:7321
          TODOLIZT_TEST_ARTIFACTS: ${{ runner.temp }}/todolizt-projects-browser
        run: |
          npm start -- -H 127.0.0.1 -p 7321 > "$RUNNER_TEMP/next.log" 2>&1 &
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "$TODOLIZT_TEST_ORIGIN/"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/next.log"
            exit 1
          fi
          npm run test:browser
